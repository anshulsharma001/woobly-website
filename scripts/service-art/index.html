<!doctype html>
<!--
  Service art generator — renders public/images/services/service-1.png … service-5.png.

  Open this file in Chrome, wait for "Done", click each "Download" link.
  Query params: ?shape=3 (render just one), ?size=1360 (square px).

  Glossy porcelain / satin-silver studio sculptures on a transparent background:
    1 Brand Identity & Strategy        → pinwheel flower, 6 curved petals
    2 Digital Marketing & Growth       → 8-point starburst, tapered spikes
    3 Social Media & Content Marketing → twisted ring of stacked loops
    4 UI/UX & Product Design           → folded ribbon knot
    5 Website Design & Development     → faceted, gear-like sphere

  After replacing the PNGs, delete .next/cache/images (and
  .next/dev/cache/images) — Next caches optimised images by URL.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Service art generator</title>
    <style>
      body {
        margin: 0;
        padding: 64px 16px 16px;
        background: #f9f8f6;
        font: 14px/1.4 system-ui, sans-serif;
        color: #141414;
      }
      #status {
        position: fixed;
        top: 16px;
        left: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
      figure {
        margin: 0;
      }
      figure img {
        width: 100%;
        aspect-ratio: 1;
        display: block;
      }
      figcaption a {
        color: inherit;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="status">Rendering…</div>
    <div class="grid" id="grid"></div>

    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const params = new URLSearchParams(location.search);
      const SIZE = Number(params.get("size") || 1360);
      const ONLY = params.get("shape") ? [Number(params.get("shape"))] : [1, 2, 3, 4, 5];

      // ── Renderer (transparent) ──────────────────────────────────
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(SIZE, SIZE, false);
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const pmrem = new THREE.PMREMGenerator(renderer);
      const studio = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      // ── Materials ───────────────────────────────────────────────
      const porcelain = (flat = false) =>
        new THREE.MeshPhysicalMaterial({
          color: "#E9E8E4",
          roughness: 0.3,
          metalness: 0,
          clearcoat: 1,
          clearcoatRoughness: 0.06,
          sheen: 0.25,
          sheenColor: new THREE.Color("#ffffff"),
          flatShading: flat,
        });
      const silver = (flat = false) =>
        new THREE.MeshPhysicalMaterial({
          color: "#D8DADF",
          roughness: 0.2,
          metalness: 1,
          clearcoat: 0.6,
          clearcoatRoughness: 0.08,
          flatShading: flat,
        });

      // ── Geometry helpers ────────────────────────────────────────
      /**
       * Sweeps an elliptical cross-section (a × b) along a closed curve.
       * Wraps indices in both directions so there is no shading seam.
       */
      function sweep(curve, { segments = 800, radial = 40, a = 0.1, b = 0.1, twist = 0 } = {}) {
        const frames = curve.computeFrenetFrames(segments, true);
        const pos = [];
        const P = new THREE.Vector3();
        const v = new THREE.Vector3();
        for (let i = 0; i < segments; i++) {
          curve.getPointAt(i / segments, P);
          const N = frames.normals[i];
          const B = frames.binormals[i];
          const phi = twist * Math.PI * 2 * (i / segments);
          for (let j = 0; j < radial; j++) {
            const th = (j / radial) * Math.PI * 2;
            const x = Math.cos(th) * a;
            const y = Math.sin(th) * b;
            const cx = x * Math.cos(phi) - y * Math.sin(phi);
            const cy = x * Math.sin(phi) + y * Math.cos(phi);
            v.copy(P).addScaledVector(N, cx).addScaledVector(B, cy);
            pos.push(v.x, v.y, v.z);
          }
        }
        const idx = [];
        // A half-integer twist leaves the section rotated 180° at the seam,
        // so the last ring joins the first one half a turn round.
        const seamShift = Math.round(twist * 2) % 2 === 1 ? radial / 2 : 0;
        for (let i = 0; i < segments; i++) {
          const i2 = (i + 1) % segments;
          const shift = i2 === 0 ? seamShift : 0;
          for (let j = 0; j < radial; j++) {
            const j2 = (j + 1) % radial;
            const p00 = i * radial + j;
            const p01 = i * radial + j2;
            const p10 = i2 * radial + ((j + shift) % radial);
            const p11 = i2 * radial + ((j2 + shift) % radial);
            idx.push(p00, p10, p01, p10, p11, p01);
          }
        }
        // Make sure faces point outwards (flip winding if needed)
        const A = new THREE.Vector3().fromArray(pos, idx[0] * 3);
        const Bv = new THREE.Vector3().fromArray(pos, idx[1] * 3);
        const C = new THREE.Vector3().fromArray(pos, idx[2] * 3);
        const faceN = new THREE.Vector3().subVectors(Bv, A).cross(new THREE.Vector3().subVectors(C, A));
        curve.getPointAt(0, P);
        if (faceN.dot(new THREE.Vector3().subVectors(A, P)) < 0) {
          for (let k = 0; k < idx.length; k += 3) [idx[k + 1], idx[k + 2]] = [idx[k + 2], idx[k + 1]];
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        return g;
      }

      const extrude = (shape, depth, bevel) => {
        const g = new THREE.ExtrudeGeometry(shape, {
          depth,
          bevelEnabled: true,
          bevelThickness: bevel,
          bevelSize: bevel * 0.8,
          bevelSegments: 14,
          curveSegments: 96,
        });
        g.translate(0, 0, -depth / 2);
        g.computeVertexNormals();
        return g;
      };

      // ── 1 · Pinwheel flower: 6 curved, pitched petals ───────────
      function flower() {
        const group = new THREE.Group();
        const s = new THREE.Shape();
        s.moveTo(0.1, -0.06);
        s.bezierCurveTo(0.34, -0.4, 0.86, -0.42, 1.02, 0.02);
        s.bezierCurveTo(0.92, 0.26, 0.56, 0.34, 0.2, 0.17);
        s.quadraticCurveTo(0.04, 0.08, 0.1, -0.06);
        const petal = extrude(s, 0.1, 0.085);
        const mat = porcelain();
        for (let i = 0; i < 6; i++) {
          const arm = new THREE.Group();
          arm.rotation.z = (i / 6) * Math.PI * 2;
          const m = new THREE.Mesh(petal, mat);
          m.rotation.x = 0.42; // pitch, like a pinwheel blade
          m.position.z = i * 0.012; // tiny stagger so the spiral overlaps cleanly
          arm.add(m);
          group.add(arm);
        }
        const hub = new THREE.Mesh(new THREE.SphereGeometry(0.17, 64, 48), mat);
        hub.scale.z = 0.7;
        hub.position.z = 0.08;
        group.add(hub);
        group.rotation.set(-0.5, 0.42, 0.15);
        return group;
      }

      // ── 2 · Starburst: 8 tapered spikes around a central sphere ─
      /** A tapered spike along +Y from the origin, with a softly rounded tip. */
      function spikeGeometry(length, baseRadius) {
        const pts = [new THREE.Vector2(0, 0)];
        const steps = 48;
        const tipR = baseRadius * 0.12;
        for (let i = 0; i <= steps; i++) {
          const y = (i / steps) * (length - tipR);
          const r = tipR + (baseRadius - tipR) * (1 - y / length) ** 1.6;
          pts.push(new THREE.Vector2(r, y));
        }
        for (let i = 1; i <= 12; i++) {
          const a = (i / 12) * (Math.PI / 2);
          pts.push(new THREE.Vector2(Math.cos(a) * tipR, length - tipR + Math.sin(a) * tipR));
        }
        return new THREE.LatheGeometry(pts, 96);
      }
      function starburst() {
        const group = new THREE.Group();
        const mat = silver();
        const long = spikeGeometry(1.0, 0.2);
        const short = spikeGeometry(0.72, 0.17);
        for (let k = 0; k < 8; k++) {
          const spike = new THREE.Mesh(k % 2 ? short : long, mat);
          spike.rotation.z = (k / 8) * Math.PI * 2;
          spike.rotation.x = k % 2 ? 0.22 : -0.08; // splay alternate spikes out of plane
          group.add(spike);
        }
        group.add(new THREE.Mesh(new THREE.SphereGeometry(0.27, 96, 64), mat));
        group.rotation.set(-0.45, 0.5, 0.12);
        return group;
      }

      // ── 3 · Twisted ring of stacked loops (a coil bent into a torus)
      class CoilCurve extends THREE.Curve {
        getPoint(t, target = new THREE.Vector3()) {
          const u = t * Math.PI * 2;
          const R = 0.76;
          const r = 0.24;
          const turns = 22;
          const w = turns * u;
          return target.set((R + r * Math.cos(w)) * Math.cos(u), (R + r * Math.cos(w)) * Math.sin(u), r * Math.sin(w));
        }
      }
      function twistedRing() {
        const g = sweep(new CoilCurve(), { segments: 3600, radial: 28, a: 0.052, b: 0.052 });
        const group = new THREE.Group();
        group.add(new THREE.Mesh(g, porcelain()));
        group.rotation.set(-0.72, 0.3, 0.15);
        return group;
      }

      // ── 4 · Folded ribbon knot (trefoil, flat ribbon section) ───
      class TrefoilCurve extends THREE.Curve {
        getPoint(t, target = new THREE.Vector3()) {
          const u = t * Math.PI * 2;
          const k = 0.34;
          return target.set(
            k * (Math.sin(u) + 2 * Math.sin(2 * u)),
            k * (Math.cos(u) - 2 * Math.cos(2 * u)),
            k * -1.8 * Math.sin(3 * u),
          );
        }
      }
      function ribbonKnot() {
        const g = sweep(new TrefoilCurve(), { segments: 1600, radial: 56, a: 0.19, b: 0.034, twist: 1.5 });
        const group = new THREE.Group();
        group.add(new THREE.Mesh(g, porcelain()));
        group.rotation.set(0.35, -0.45, 0.1);
        return group;
      }

      // ── 5 · Faceted, gear-like sphere: geodesic porcelain ball with
      //    a satin-silver cog ring set around its equator ─────────
      function gearSphere() {
        const group = new THREE.Group();
        group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), porcelain(true)));

        const teeth = 16;
        const root = 1.07;
        const tip = 1.24;
        const pitch = (Math.PI * 2) / teeth;
        const at = (r, a) => [Math.cos(a) * r, Math.sin(a) * r];
        const gear = new THREE.Shape();
        for (let k = 0; k < teeth; k++) {
          const a0 = k * pitch;
          const pts = [
            at(root, a0),
            at(tip, a0 + pitch * 0.12),
            at(tip, a0 + pitch * 0.44),
            at(root, a0 + pitch * 0.56),
            at(root, a0 + pitch * 0.78),
          ];
          pts.forEach(([x, y], i) => (k === 0 && i === 0 ? gear.moveTo(x, y) : gear.lineTo(x, y)));
        }
        gear.closePath();
        const hole = new THREE.Path();
        hole.absarc(0, 0, 0.9, 0, Math.PI * 2, true);
        gear.holes.push(hole);

        const depth = 0.3;
        const ringGeo = new THREE.ExtrudeGeometry(gear, {
          depth,
          bevelEnabled: true,
          bevelThickness: 0.035,
          bevelSize: 0.028,
          bevelSegments: 5,
          curveSegments: 96,
        });
        ringGeo.translate(0, 0, -depth / 2);
        const ring = new THREE.Mesh(ringGeo, silver());
        ring.rotation.x = Math.PI / 2; // lie in the equatorial plane
        group.add(ring);

        group.rotation.set(0.42, 0.35, 0.2);
        return group;
      }

      const BUILDERS = { 1: flower, 2: starburst, 3: twistedRing, 4: ribbonKnot, 5: gearSphere };

      // ── Studio render of one sculpture ──────────────────────────
      function renderShape(id) {
        const scene = new THREE.Scene();
        scene.environment = studio;
        scene.environmentIntensity = 0.65;

        const object = BUILDERS[id]();
        object.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
          }
        });
        scene.add(object);

        // Centre the object at the origin
        object.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(object);
        const centre = box.getCenter(new THREE.Vector3());
        object.position.sub(centre);
        object.updateMatrixWorld(true);
        const sphere = new THREE.Box3().setFromObject(object).getBoundingSphere(new THREE.Sphere());

        // Soft key light from upper left, for self-shadowing
        const key = new THREE.DirectionalLight(0xffffff, 2.4);
        key.position.set(-3, 4.5, 4);
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.bias = -0.0004;
        key.shadow.normalBias = 0.02;
        const sc = key.shadow.camera;
        sc.left = sc.bottom = -sphere.radius * 1.2;
        sc.right = sc.top = sphere.radius * 1.2;
        sc.near = 0.1;
        sc.far = 20;
        scene.add(key);
        const rim = new THREE.DirectionalLight(0xffffff, 0.6);
        rim.position.set(4, -1, -3);
        scene.add(rim);

        // Fit: project every vertex, then zoom + offset so the silhouette is
        // centred and its longest side fills ~80% of the frame.
        const fov = 28;
        const camera = new THREE.PerspectiveCamera(fov, 1, 0.1, 100);
        camera.position.set(0, 0, sphere.radius / Math.sin(THREE.MathUtils.degToRad(fov / 2)));
        camera.lookAt(0, 0, 0);
        camera.updateMatrixWorld();
        camera.updateProjectionMatrix();
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const v = new THREE.Vector3();
        object.traverse((o) => {
          if (!o.isMesh) return;
          const pos = o.geometry.attributes.position;
          const step = Math.max(1, Math.floor(pos.count / 40000));
          for (let i = 0; i < pos.count; i += step) {
            v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld).project(camera);
            minX = Math.min(minX, v.x);
            maxX = Math.max(maxX, v.x);
            minY = Math.min(minY, v.y);
            maxY = Math.max(maxY, v.y);
          }
        });
        camera.zoom = 0.8 / (Math.max(maxX - minX, maxY - minY) / 2);
        camera.setViewOffset(
          SIZE,
          SIZE,
          ((minX + maxX) / 2) * camera.zoom * (SIZE / 2),
          (-(minY + maxY) / 2) * camera.zoom * (SIZE / 2),
          SIZE,
          SIZE,
        );
        camera.updateProjectionMatrix();

        renderer.render(scene, camera);
        return renderer.domElement.toDataURL("image/png");
      }

      const results = {};
      const grid = document.getElementById("grid");
      for (const id of ONLY) {
        const url = renderShape(id);
        results[id] = url;
        const fig = document.createElement("figure");
        fig.innerHTML = `<img src="${url}" alt="" /><figcaption>service-${id}.png · <a download="service-${id}.png" href="${url}">Download</a></figcaption>`;
        grid.append(fig);
      }
      document.getElementById("status").textContent = `Done — ${SIZE}×${SIZE}`;
      window.__serviceArt = results;
    </script>
  </body>
