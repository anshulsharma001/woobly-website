<!doctype html>
<!--
  Hero art generator — renders public/images/hero-art.png.

  Open this file in Chrome, wait for "Done", click "Download".
  Query params: ?w=4096 (width; height is always 3/4 of it), ?seed=7,
  ?tm=agx (tone mapping; default aces), ?debug=raw (skip the cut-out and
  show the full render), ?only=0,1,2 (render only these disc indices).

  After replacing public/images/hero-art.png, delete .next/cache/images
  (and .next/dev/cache/images) — Next caches optimised images by URL.

  How it works: iridescent glass discs refract a soft colour backdrop that
  only ever shows *through* the glass. Three renders — glass, backdrop alone,
  and a coverage mask — produce a clean, transparent PNG.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hero art generator</title>
    <style>
      body {
        margin: 0;
        background: #f9f8f6;
        font: 14px/1.4 system-ui, sans-serif;
        color: #141414;
      }
      .bar {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      a.btn {
        background: #141414;
        color: #fff;
        padding: 8px 14px;
        border-radius: 99px;
        text-decoration: none;
      }
      a.btn[aria-disabled="true"] {
        opacity: 0.4;
        pointer-events: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: auto;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="bar">
      <a class="btn" id="download" download="hero-art.png" aria-disabled="true">Download</a>
      <span id="status">Rendering…</span>
    </div>
    <canvas id="out"></canvas>

    <script type="module">
      import * as THREE from "three";

      const params = new URLSearchParams(location.search);
      const W = Number(params.get("w") || 2880);
      const H = Math.round((W * 3) / 4);
      const SEED = Number(params.get("seed") || 7);
      const DEBUG = params.get("debug");

      // ── Helpers ─────────────────────────────────────────────────
      function mulberry32(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(SEED);
      const range = (a, b) => a + (b - a) * rand();
      const smoothstep = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      };
      const lerp = (a, b, t) => a + (b - a) * t;

      // ── Renderer / camera ───────────────────────────────────────
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      const TONE = params.get("tm") || "aces";
      renderer.toneMapping = TONE === "agx" ? THREE.AgXToneMapping : THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = TONE === "agx" ? 1.2 : 1.0;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
      camera.position.set(0, 0, 16);
      // Visible area at z = 0 is about ±5.7 × ±4.3 units.

      // ── Studio environment (reflections): dark room, coloured softboxes
      function makeEnvironment() {
        const env = new THREE.Scene();
        env.add(
          new THREE.Mesh(
            new THREE.BoxGeometry(40, 40, 40),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(0.2, 0.19, 0.25), side: THREE.BackSide }),
          ),
        );
        const panel = (w, h, rgb, pos) => {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(...rgb), side: THREE.DoubleSide }),
          );
          m.position.set(...pos);
          m.lookAt(0, 0, 0);
          env.add(m);
        };
        panel(16, 5, [9, 9, 9], [0, 14, 4]); //             top softbox
        panel(4, 12, [6, 6, 6.4], [-9, 4, 12]); //          front-left strip
        panel(4, 12, [6.4, 6, 6], [9, 4, 12]); //           front-right strip
        panel(6, 16, [2.6, 1.3, 7.0], [-14, 0, 2]); //      violet, left
        panel(6, 16, [7.0, 3.4, 1.0], [14, 0, 2]); //       amber, right
        panel(10, 12, [0.8, 1.6, 7.5], [-6, 2, -14]); //    cobalt, back-left
        panel(10, 12, [5.0, 1.2, 6.0], [7, -2, -14]); //    purple, back-right
        panel(18, 5, [0.7, 1.4, 6.0], [0, -14, 0]); //      cobalt floor bounce
        const pmrem = new THREE.PMREMGenerator(renderer);
        return pmrem.fromScene(env, 0.04).texture;
      }
      scene.environment = makeEnvironment();

      // ── Backdrop (only ever seen through the glass) ─────────────
      function makeBackdrop() {
        const c = document.createElement("canvas");
        c.width = 1600;
        c.height = 1200;
        const g = c.getContext("2d");
        const base = g.createLinearGradient(0, 0, 0, c.height);
        base.addColorStop(0, "#F3EEFB");
        base.addColorStop(1, "#E6EBFC");
        g.fillStyle = base;
        g.fillRect(0, 0, c.width, c.height);

        g.filter = "blur(70px)";
        const blob = (x, y, r, color, alpha = 1) => {
          const grad = g.createRadialGradient(x * c.width, y * c.height, 0, x * c.width, y * c.height, r * c.width);
          grad.addColorStop(0, color);
          grad.addColorStop(1, "rgba(0,0,0,0)");
          g.globalAlpha = alpha;
          g.fillStyle = grad;
          g.fillRect(0, 0, c.width, c.height);
        };
        blob(0.12, 0.22, 0.3, "#6A55F2", 0.95); //  violet, upper left
        blob(0.26, 0.48, 0.22, "#B07CF6", 0.9); //  purple
        blob(0.06, 0.08, 0.16, "#2B1E7A", 0.8); //  deep indigo accent
        blob(0.5, 0.82, 0.3, "#3D5BFF", 0.95); //   cobalt, bottom centre
        blob(0.66, 0.66, 0.18, "#4F7CFF", 0.85); // blue
        blob(0.36, 0.7, 0.14, "#E79AE0", 0.55); //  pink sheen
        blob(0.88, 0.24, 0.3, "#FFB35C", 0.95); //  amber, upper right
        blob(0.76, 0.5, 0.16, "#A58BFA", 0.7); //  violet, right
        blob(0.97, 0.04, 0.13, "#F08A2C", 0.75); // deep amber accent

        g.globalAlpha = 1;
        g.filter = "none";

        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
      const backdrop = makeBackdrop();

      // ── Disc geometry: a lens with a rounded rim (lathe) ────────
      function discGeometry() {
        const R = 1;
        const T = 0.15;
        const rr = T / 2;
        const bulge = 0.07;
        const pts = [];
        const flat = 32;
        for (let i = 0; i <= flat; i++) {
          const x = (i / flat) * (R - rr);
          pts.push(new THREE.Vector2(x, rr + bulge * (1 - (x / (R - rr)) ** 2)));
        }
        const rim = 24;
        for (let i = 1; i < rim; i++) {
          const a = Math.PI / 2 - (i / rim) * Math.PI;
          pts.push(new THREE.Vector2(R - rr + Math.cos(a) * rr, Math.sin(a) * rr));
        }
        for (let i = flat; i >= 0; i--) {
          const x = (i / flat) * (R - rr);
          pts.push(new THREE.Vector2(x, -(rr + bulge * (1 - (x / (R - rr)) ** 2))));
        }
        return new THREE.LatheGeometry(pts, 180);
      }
      const geometry = discGeometry();

      // ── Glass ───────────────────────────────────────────────────
      const PALETTE = {
        violet: "#8B7CF6",
        purple: "#B07CF6",
        cobalt: "#3D5BFF",
        blue: "#4F7CFF",
        amber: "#F5B97A",
        peach: "#FFC9A0",
      };
      function glass(tintHex) {
        const tint = new THREE.Color(tintHex);
        return new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(1, 1, 1).lerp(tint, 0.12),
          metalness: 0,
          roughness: 0.06,
          transmission: 1,
          thickness: 1.6,
          ior: 1.5,
          dispersion: 8,
          attenuationColor: tint,
          attenuationDistance: 2.6,
          iridescence: 1,
          iridescenceIOR: 1.3,
          iridescenceThicknessRange: [160, 900],
          clearcoat: 1,
          clearcoatRoughness: 0.03,
          specularIntensity: 1,
          envMapIntensity: 1.5,
        });
      }

      const discs = [];
      const UP = new THREE.Vector3(0, 1, 0);
      function addDisc({ position, normal, radius, thinness = 1, tint }) {
        const mesh = new THREE.Mesh(geometry, glass(tint));
        mesh.position.copy(position);
        mesh.quaternion.setFromUnitVectors(UP, normal.clone().normalize());
        mesh.scale.set(radius, radius * thinness, radius);
        const only = params.get("only"); // debug: comma-separated disc indices
        mesh.visible = !only || only.split(",").map(Number).includes(discs.length);
        scene.add(mesh);
        discs.push(mesh);
      }

      // ── Layout: a sweeping U — big clusters top-left / top-right,
      //    thin edge-on discs dipping through the bottom centre ────
      const pathPoint = (t) => new THREE.Vector3(5.0 * t, -2.05 + 4.1 * t * t, -1.4 + 3.8 * t * t);
      const pathTangent = (t) => new THREE.Vector3(5.0, 8.2 * t, 0).normalize();

      const N = 21;
      for (let i = 0; i < N; i++) {
        const u = -1 + (2 * i) / (N - 1);
        const t = Math.sign(u) * Math.abs(u) ** 0.78; // denser towards the ends
        const a = Math.abs(t);
        const side = Math.sign(t) || 1;

        const position = pathPoint(t);
        const edgeOn = pathTangent(t).add(new THREE.Vector3(0, 0, 0.32)).normalize();
        const faceOn = new THREE.Vector3(-0.4 * side, 0.18, 1).normalize();
        const normal = edgeOn.lerp(faceOn, smoothstep(0.3, 1.0, a)).normalize();

        let tint;
        if (t < -0.42) tint = i % 2 ? PALETTE.violet : PALETTE.purple;
        else if (t > 0.64) tint = i % 2 ? PALETTE.amber : PALETTE.peach;
        else if (t > 0.42) tint = i % 2 ? PALETTE.violet : PALETTE.blue;
        else tint = i % 3 === 0 ? PALETTE.violet : i % 2 ? PALETTE.cobalt : PALETTE.blue;

        addDisc({
          position,
          normal,
          radius: lerp(0.6, 1.12, a ** 2),
          thinness: lerp(0.6, 1, a),
          tint,
        });
      }

      // Extra discs to build the two upper clusters
      for (const side of [-1, 1]) {
        const base = new THREE.Vector3(4.55 * side, 1.5, -0.4);
        const offsets = [
          [0.55, 0.7, -1.9, 1.45],
          [-0.55, -0.1, 3.0, 0.8],
          [1.05, -0.65, -1.3, 1.05],
          [1.2, 1.1, -3.2, 1.3],
        ];
        offsets.forEach(([dx, dy, dz, r], k) => {
          const position = base.clone().add(new THREE.Vector3(dx * side, dy, dz));
          const normal = new THREE.Vector3(range(-0.7, -0.15) * side, range(-0.15, 0.45), 1);
          const tint =
            side < 0
              ? [PALETTE.purple, PALETTE.violet, PALETTE.cobalt, PALETTE.blue][k]
              : [PALETTE.amber, PALETTE.peach, PALETTE.amber, PALETTE.violet][k];
          addDisc({ position, normal, radius: r, tint });
        });
      }

      // ── Renders ─────────────────────────────────────────────────
      const scratch = document.createElement("canvas");
      scratch.width = W;
      scratch.height = H;
      const sctx = scratch.getContext("2d", { willReadFrequently: true });
      function capture() {
        sctx.clearRect(0, 0, W, H);
        sctx.drawImage(renderer.domElement, 0, 0);
        return sctx.getImageData(0, 0, W, H).data;
      }

      // 1) Glass refracting the backdrop
      scene.background = backdrop;
      renderer.render(scene, camera);
      const glassPx = capture();

      // 2) Backdrop alone (used to clean anti-aliased edges)
      const shown = discs.map((d) => d.visible);
      discs.forEach((d) => (d.visible = false));
      renderer.render(scene, camera);
      const backdropPx = capture();
      discs.forEach((d, i) => (d.visible = shown[i]));

      // 3) Coverage mask
      scene.background = new THREE.Color(0x000000);
      scene.environment = null;
      scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.render(scene, camera);
      const maskPx = capture();

      // ── Compose transparent PNG ─────────────────────────────────
      const out = document.getElementById("out");
      out.width = W;
      out.height = H;
      const octx = out.getContext("2d");
      const img = octx.createImageData(W, H);
      const d = img.data;
      if (DEBUG === "raw") {
        d.set(glassPx);
      } else {
        for (let i = 0; i < d.length; i += 4) {
          const alpha = maskPx[i] / 255;
          if (alpha <= 0) continue;
          // Edge pixel = alpha·glass + (1 − alpha)·backdrop → solve for glass
          for (let c = 0; c < 3; c++) {
            const v = (glassPx[i + c] - (1 - alpha) * backdropPx[i + c]) / alpha;
            d[i + c] = Math.max(0, Math.min(255, Math.round(v)));
          }
          d[i + 3] = maskPx[i];
        }
      }
      octx.putImageData(img, 0, 0);

      const dataUrl = out.toDataURL("image/png");
      const link = document.getElementById("download");
      link.href = dataUrl;
      link.removeAttribute("aria-disabled");
      document.getElementById("status").textContent = `Done — ${W}×${H}`;
      window.__heroArt = dataUrl;
    </script>
  </body>
</html>
